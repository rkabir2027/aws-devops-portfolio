name: AWS-Devops-Portfolio CI 

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
           python -m pip install --upgrade pip 
           pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -v tests/

      - name: Build Docker image
        run: docker build -t aws-devops-portfolio:ci .
      - name: Verify Docker image
        run: docker images